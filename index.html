<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juleo Hermanto — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --fg: #F5F5F5;
    --muted: #888888;
    --dim: #555555;
    --line: rgba(255,255,255,.06);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  body.light {
    --bg: #F5F5F5; --fg: #080808; --muted: #6a6a6a; --dim: #aaaaaa;
    --line: rgba(0,0,0,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{
    width:100vw;height:100vh;overflow:hidden;
    background:var(--bg);color:var(--fg);
    font-family:'Inter Tight',system-ui,sans-serif;
    cursor:none;
    transition:background .8s var(--ease),color .8s var(--ease);
  }
  a,button{cursor:none}

  /* film grain */
  .grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:50;opacity:.03;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1s steps(6) infinite}
  @keyframes grain{
    0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(4%,-6%)}
    60%{transform:translate(-3%,5%)}80%{transform:translate(6%,2%)}100%{transform:translate(0,0)}}

  /* frame + crosshairs */
  .frame{position:fixed;inset:24px;border:1px solid var(--line);pointer-events:none;z-index:1;
    transition:border-color .8s var(--ease)}
  .cross{position:fixed;width:15px;height:15px;pointer-events:none;z-index:2;opacity:.9}
  .cross::before,.cross::after{content:"";position:absolute;background:var(--muted);opacity:.5}
  .cross::before{left:7px;top:0;width:1px;height:100%}
  .cross::after{top:7px;left:0;height:1px;width:100%}
  .cross.tl{top:17px;left:17px}.cross.tr{top:17px;right:17px}
  .cross.bl{bottom:17px;left:17px}.cross.br{bottom:17px;right:17px}

  /* meta */
  .meta{position:fixed;z-index:3;font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);opacity:0;animation:fade 1.6s var(--ease) 1.2s forwards}
  .meta.l{left:44px;bottom:44px}.meta.r{right:44px;top:44px}.meta.t{left:44px;top:44px}

  /* centerpiece */
  .stage{position:fixed;inset:0;display:grid;place-items:center;z-index:5}
  .wrap{display:flex;flex-direction:column;width:fit-content;max-width:92vw}
  .headline{
    font-weight:800;letter-spacing:-.04em;line-height:1;
    font-size:clamp(3.5rem,10vw,9rem);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .headline .dud{color:var(--dim);font-family:'JetBrains Mono',monospace;font-weight:400;letter-spacing:0}
  .sig{
    align-self:flex-end;text-align:right;margin-top:.75rem;
    font:400 .75rem/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--muted);
    opacity:0;transform:translateY(6px);
    animation:fade 1.4s var(--ease) 1s forwards;
  }
  @keyframes fade{to{opacity:1;transform:none}}

  /* cursor */
  .cursor{position:fixed;top:0;left:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
    background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:100;
    transition:width .4s var(--ease),height .4s var(--ease),margin .4s var(--ease);will-change:transform}
  .cursor.active{width:72px;height:72px;margin:-36px 0 0 -36px}

  /* theme toggle */
  .toggle{position:fixed;right:44px;bottom:44px;z-index:60;width:14px;height:14px;background:none;border:0;
    display:grid;place-items:center}
  .toggle i{display:block;width:5px;height:5px;border-radius:50%;background:var(--fg);transition:transform .4s var(--ease)}
  .toggle:hover i{transform:scale(2)}

  @media (max-width:600px){.meta.t,.meta.r{display:none}.frame{inset:14px}
    .cross.tl,.cross.tr{top:7px}.cross.bl,.cross.br{bottom:7px}.cross.tl,.cross.bl{left:7px}.cross.tr,.cross.br{right:7px}
    .meta.l{left:30px;bottom:30px}.toggle{right:30px;bottom:30px}}
  @media (hover:none){body,a,button{cursor:auto}.cursor{display:none}}
  @media (prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="frame"></div>
  <span class="cross tl"></span><span class="cross tr"></span>
  <span class="cross bl"></span><span class="cross br"></span>

  <span class="meta t">Index / 001</span>
  <span class="meta r">Portfolio — 2026</span>
  <span class="meta l">Jakarta, ID — GMT+7</span>

  <main class="stage">
    <div class="wrap" data-hover>
      <h1 class="headline" id="headline" aria-live="polite">&nbsp;</h1>
      <p class="sig">- Juleo Hermanto</p>
    </div>
  </main>

  <button class="toggle" id="toggle" aria-label="Toggle theme"><i></i></button>
  <div class="cursor" id="cursor"></div>

<script>
/** TextScramble — per-character cipher morph driven by requestAnimationFrame */
class TextScramble {
  constructor(el, chars = '!<>-_\\/[]{}—=+*^?#________%&@$~') {
    this.el = el; this.chars = chars; this.frame = 0; this.queue = [];
    this.raf = 0; this.update = this.update.bind(this);
  }
  setText(newText) {
    const oldText = this.el.textContent.replace(/\u00a0/g, ' ');
    const length = Math.max(oldText.length, newText.length);
    this.queue = [];
    for (let i = 0; i < length; i++) {
      const start = Math.floor(Math.random() * 22);
      const end = start + 14 + Math.floor(Math.random() * 22);
      this.queue.push({ from: oldText[i] || '', to: newText[i] || '', start, end, char: '' });
    }
    cancelAnimationFrame(this.raf);
    this.frame = 0;
    return new Promise(resolve => { this.resolve = resolve; this.update(); });
  }
  update() {
    let out = '', complete = 0;
    for (const q of this.queue) {
      if (this.frame >= q.end) { complete++; out += this.esc(q.to); }
      else if (this.frame >= q.start) {
        if (!q.char || Math.random() < 0.28) q.char = this.rand();
        out += q.to === ' ' && !q.from.trim() ? ' ' : `<span class="dud">${this.esc(q.char)}</span>`;
      } else out += this.esc(q.from);
    }
    this.el.innerHTML = out;
    if (complete === this.queue.length) { this.resolve(); return; }
    this.frame++;
    this.raf = requestAnimationFrame(this.update);
  }
  rand() { return this.chars[Math.floor(Math.random() * this.chars.length)]; }
  esc(c) { return c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c === ' ' ? '&nbsp;' : c; }
}

/** Looping morph between phrases, timed with rAF */
class Morpher {
  constructor(el, phrases, interval = 3500) {
    this.fx = new TextScramble(el); this.phrases = phrases;
    this.interval = interval; this.i = 0; this.busy = false; this.last = 0;
    this.tick = this.tick.bind(this);
  }
  async start() {
    el: { }
    await this.fx.setText(this.phrases[0]);
    this.last = performance.now();
    requestAnimationFrame(this.tick);
  }
  tick(now) {
    if (!this.busy && now - this.last >= this.interval) this.next();
    requestAnimationFrame(this.tick);
  }
  async next() {
    if (this.busy) return;
    this.busy = true;
    this.i = (this.i + 1) % this.phrases.length;
    await this.fx.setText(this.phrases[this.i]);
    this.busy = false; this.last = performance.now();
  }
}

/** Smooth custom cursor */
class Cursor {
  constructor(el) {
    this.el = el; this.x = this.tx = innerWidth / 2; this.y = this.ty = innerHeight / 2;
    addEventListener('pointermove', e => { this.tx = e.clientX; this.ty = e.clientY; });
    document.querySelectorAll('[data-hover],button').forEach(n => {
      n.addEventListener('pointerenter', () => el.classList.add('active'));
      n.addEventListener('pointerleave', () => el.classList.remove('active'));
    });
    this.loop = this.loop.bind(this); this.loop();
  }
  loop() {
    this.x += (this.tx - this.x) * 0.2; this.y += (this.ty - this.y) * 0.2;
    this.el.style.transform = `translate3d(${this.x}px,${this.y}px,0)`;
    requestAnimationFrame(this.loop);
  }
}

const morpher = new Morpher(document.getElementById('headline'), ['Hello', 'Coming Soon']);
morpher.start();
document.querySelector('.wrap').addEventListener('pointerenter', () => morpher.next());
new Cursor(document.getElementById('cursor'));
document.getElementById('toggle').addEventListener('click', () => document.body.classList.toggle('light'));
</script>
</body>
</html>
